version: 2

updates:
  # Root orchestration manifest (dev tooling).
  - package-ecosystem: npm
    directory: /
    # Staging-first workflow: dep updates soak on `staging`
    # like every other change, then promote to `main`.
    target-branch: "staging"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Realtime backend (Express + Socket.io).
  - package-ecosystem: npm
    directory: /server
    target-branch: "staging"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # React + Vite + Leaflet frontend.
  - package-ecosystem: npm
    directory: /client
    target-branch: "staging"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Server container base image (server/Dockerfile).
  - package-ecosystem: docker
    directory: /server
    target-branch: "staging"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Action version bumps in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    target-branch: "staging"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GCP infrastructure definitions.
  - package-ecosystem: terraform
    directory: /terraform
    target-branch: "staging"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
