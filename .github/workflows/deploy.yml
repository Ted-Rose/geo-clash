name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

env:
  PROJECT: geo-clash-gc798
  REGION: europe-north2        # update to match your chosen region
  IMAGE_BASE: europe-north2-docker.pkg.dev/geo-clash-gc798/geo-clash/server

jobs:
  # Production only — a staging push must never reach the
  # terraform-managed prod service. workflow_dispatch from the
  # main branch still matches this guard.
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: >
          gcloud auth configure-docker
          ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push Docker image
        run: |
          TAG=$(git rev-parse --short HEAD)
          # Repo-root context: the Dockerfile also builds the client.
          # VITE_SENTRY_DSN bakes Sentry into the bundled SPA — it's a
          # public-by-design client key, so a repo variable suffices.
          docker build -f server/Dockerfile \
            --build-arg VITE_SENTRY_DSN="${{ vars.VITE_SENTRY_DSN }}" \
            -t ${{ env.IMAGE_BASE }}:${TAG} .
          docker push    ${{ env.IMAGE_BASE }}:${TAG}
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Bootstrap GCP APIs
        run: |
          gcloud services enable cloudresourcemanager.googleapis.com
          gcloud services enable iam.googleapis.com
        env:
          CLOUDSDK_CORE_PROJECT: ${{ env.PROJECT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.5"

      - name: Terraform init
        run: terraform init
        working-directory: terraform

      - name: Terraform apply
        # A missing/empty CORS_ORIGIN secret must not override the
        # terraform/variables.tf allowlist default — export the
        # TF_VAR only when the secret carries a value.
        run: |
          if [ -n "$CORS_ORIGIN_SECRET" ]; then
            export TF_VAR_cors_origin="$CORS_ORIGIN_SECRET"
          fi
          terraform apply -auto-approve \
            -var="image_tag=${{ env.IMAGE_TAG }}"
        working-directory: terraform
        env:
          TF_VAR_project: ${{ env.PROJECT }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_valkey_url: ${{ secrets.VALKEY_URL }}
          # Public-by-design client key — a repo variable, not a
          # secret. Empty leaves Sentry disabled on the service.
          TF_VAR_sentry_dsn: ${{ vars.SENTRY_DSN }}
          CORS_ORIGIN_SECRET: ${{ secrets.CORS_ORIGIN }}

  # Staging deploy — deliberately NOT terraform-managed (unlike
  # prod's geo-clash-server). Pushes to `staging` build the same
  # image and deploy it to a dedicated Cloud Run service that:
  #   - scales to zero (--min-instances=0) so idle staging costs
  #     nothing,
  #   - gets no VALKEY_URL → in-memory store, so staging game
  #     state is isolated from prod (the vercel.json
  #     /api/map/tiles rewrite still proxies the prod server —
  #     read-only),
  #   - is public because the Vercel staging preview must reach
  #     it — it holds no prod data.
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: >
          gcloud auth configure-docker
          ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push Docker image
        run: |
          TAG=staging-$(git rev-parse --short HEAD)
          # Repo-root context: the Dockerfile also builds the
          # client.
          docker build -f server/Dockerfile \
            --build-arg VITE_SENTRY_DSN="${{ vars.VITE_SENTRY_DSN }}" \
            -t ${{ env.IMAGE_BASE }}:${TAG} .
          docker push    ${{ env.IMAGE_BASE }}:${TAG}
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Deploy staging Cloud Run service
        run: |
          # CORS mirrors the terraform-managed prod allowlist
          # (terraform/variables.tf default): prod domain plus
          # this project's Vercel preview hostnames. The `^;^`
          # prefix switches gcloud's key=value pair delimiter to
          # ';' so the comma INSIDE the value stays literal —
          # without it gcloud rejects the flag ("Bad syntax for
          # dict arg").
          cors="https://geoclashers.vercel.app"
          cors="$cors,https://geo-clash-*-industr-analysers-"
          cors="${cors}projects.vercel.app"
          # NODE_ENV=staging tags Sentry events with the staging
          # environment; SENTRY_DSN is a public client key (repo
          # variable). Empty DSN leaves Sentry disabled.
          envvars="^;^CORS_ORIGIN=$cors;NODE_ENV=staging"
          envvars="$envvars;SENTRY_DSN=${{ vars.SENTRY_DSN }}"
          gcloud run deploy geo-clash-server-staging \
            --image "${{ env.IMAGE_BASE }}:${{ env.IMAGE_TAG }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT }}" \
            --allow-unauthenticated \
            --min-instances=0 --max-instances=1 \
            --set-env-vars "$envvars"
          url=$(gcloud run services describe \
            geo-clash-server-staging \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT }}" \
            --format 'value(status.url)')
          echo "### Staging deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
