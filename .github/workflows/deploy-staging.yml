name: Deploy staging

# Staging-first workflow: pushes to `staging` deploy the
# full-stack staging environment — the `geo-clash-staging`
# Cloud Run service, which serves the built client and the
# Socket.io API same-origin (like prod's image). The service
# is ad-hoc (not Terraform-managed): it mirrors prod's flags
# but shares nothing else — the Valkey keyspace is isolated
# via VALKEY_KEY_PREFIX=staging: so staging and prod can use
# the same Aiven instance safely (Aiven's `default` user
# cannot create ACL users; the prefix is the boundary).
# Scales to zero when idle; public like prod (the game has
# no auth layer of its own).
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  PROJECT: geo-clash-gc798
  REGION: europe-north2
  IMAGE_BASE: europe-north2-docker.pkg.dev/geo-clash-gc798/geo-clash/server
  SERVICE_NAME: geo-clash-staging

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: >
          gcloud auth configure-docker
          ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push Docker image
        run: |
          TAG="staging-$(git rev-parse --short HEAD)"
          # Repo-root context: the Dockerfile also builds the
          # client (without VITE_SERVER_URL → same-origin).
          docker build -f server/Dockerfile \
            -t ${{ env.IMAGE_BASE }}:${TAG} .
          docker push    ${{ env.IMAGE_BASE }}:${TAG}
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Deploy staging Cloud Run service
        # env-vars-file dodges --set-env-vars comma-splitting:
        # CORS_ORIGIN is a comma-separated allowlist.
        env:
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
        run: |
          {
            echo "VALKEY_KEY_PREFIX: staging:"
            echo "CORS_ORIGIN: \"$CORS_ORIGIN\""
            echo "VALKEY_URL: \"$VALKEY_URL\""
          } > env.yaml
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE_BASE }}:${{ env.IMAGE_TAG }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 --max-instances=1 \
            --memory=512Mi --cpu=1 \
            --timeout=3600 \
            --env-vars-file=env.yaml \
            --quiet
          rm -f env.yaml

      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe \
            ${{ env.SERVICE_NAME }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT }} \
            --format='value(status.url)')
          echo "SERVICE_URL=${SERVICE_URL}" >> $GITHUB_ENV
          {
            echo "## Staging deployment"
            echo ""
            echo "✅ **Service**: ${{ env.SERVICE_NAME }}"
            echo "🌐 **URL**: ${SERVICE_URL}"
            echo "🔑 **Valkey keyspace**: \`staging:*\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check
        run: |
          sleep 10
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SERVICE_URL}/" || echo "000")
          echo "GET / -> ${CODE}"
          test "${CODE}" = "200"
