name: Dependabot auto-merge

# pull_request_target runs in the base-repo context with a writable
# GITHUB_TOKEN, which Dependabot's regular pull_request runs do not
# get. Safe here because the PR code is never checked out.
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    concurrency:
      group: >-
        dependabot-automerge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      REPO: ${{ github.repository }}
      # Optional: a PAT stored as AUTOMERGE_TOKEN makes gh act as
      # a user instead of github-actions[bot]. Kept as a fallback
      # in case a branch rule ever stops counting bot approvals.
      GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Every update type is eligible, majors included. The
      # metadata above is only logged for debugging.
      - name: Log update metadata
        run: |
          echo "Deps: ${{ steps.metadata.outputs.dependency-names }}"
          echo "Type: ${{ steps.metadata.outputs.update-type }}"

      # The main ruleset has no required checks, so --auto alone
      # would merge before test.yml finishes. Poll the head SHA's
      # check runs and non-Vercel commit statuses first instead.
      - name: Wait for checks to pass
        run: |
          # Poll check runs directly: this job's own "automerge"
          # check appears on the PR, so `gh pr checks --watch`
          # would wait for itself forever. Also poll legacy
          # commit statuses (which never include check runs).
          sha=$(gh pr view "$PR_URL" --json headRefOid \
            -q .headRefOid)
          ok=0
          for i in $(seq 1 55); do
            # --paginate fetches every page and jq -s slurps
            # them into one array before evaluating, so >30
            # checks can't be under-counted (jq ships on
            # GitHub-hosted runners; --slurp can't combine
            # with gh's own --jq).
            res=$(gh api --paginate \
              "repos/$REPO/commits/$sha/check-runs" |
              jq -sr '[.[].check_runs[] |
                    select(.name != "automerge")]
                    as $c |
                    if ($c | length) == 0 then "none"
                    elif ([$c[] | select(.status != "completed")]
                          | length) > 0 then "pending"
                    elif ([$c[] | select(.conclusion != "success"
                          and .conclusion != "skipped"
                          and .conclusion != "neutral")] | length)
                         > 0 then "failed"
                    else "passed" end')
            # Statuses arrive newest-first; use only the latest
            # event per context, else a superseded "pending"
            # blocks the loop forever. The "Vercel" context is
            # excluded: the account-level build quota makes it
            # flap to "failure" ("Deployment rate limited") or
            # stick at "pending" for hours, it is not a required
            # check in the main ruleset, and the owner merges
            # Dependabot PRs through it anyway. Real CI gates on
            # the check-runs poll above.
            st=$(gh api --paginate \
              "repos/$REPO/commits/$sha/statuses" |
              jq -sr '([.[][] | select(.context != "Vercel")] |
                    group_by(.context) |
                    map(.[0])) as $s |
                    if ($s | length) == 0 then "none"
                    elif ([$s[] | select(.state == "error" or
                          .state == "failure")] | length) > 0
                    then "failed"
                    elif ([$s[] | select(.state == "pending")]
                          | length) > 0 then "pending"
                    else "passed" end')
            if [ "$res" = "failed" ] || [ "$st" = "failed" ]; then
              echo "A PR check failed"; exit 1
            fi
            if [ "$res" != "pending" ] && [ "$st" != "pending" ] \
               && { [ "$res" = "passed" ] \
                    || [ "$st" = "passed" ]; }; then
              ok=1; break
            fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "Timed out waiting for checks"; exit 1
          fi

      # The main ruleset requires 1 approving review. With the
      # AUTOMERGE_TOKEN PAT this runs as the repo admin and
      # satisfies it; GITHUB_TOKEN approves as
      # github-actions[bot], which also counts today.
      - name: Approve PR
        run: gh pr review "$PR_URL" --approve

      - name: Enable auto-merge (squash)
        run: |
          # This job re-runs after every Dependabot rebase; if a
          # previous run already enabled auto-merge, `gh pr
          # merge --auto` fails noisily even though the PR will
          # still merge. Bail out cleanly instead.
          amr=$(gh pr view "$PR_URL" --json autoMergeRequest \
            -q '.autoMergeRequest.enabledAt // empty')
          if [ -n "$amr" ]; then
            echo "Auto-merge already enabled"; exit 0
          fi
          if out=$(gh pr merge "$PR_URL" --auto --squash 2>&1)
          then
            echo "$out"
            exit 0
          fi
          echo "$out"
          status=$(gh pr view "$PR_URL" --json mergeStateStatus \
            -q .mergeStateStatus)
          if [ "$status" = "BEHIND" ]; then
            # A workflow push would not trigger CI and would make
            # Dependabot disown the PR ("edited by someone
            # else"). Leave the branch alone: Dependabot rebases
            # conflicting PRs itself, which re-runs this job.
            echo "Branch behind main; awaiting Dependabot rebase."
            exit 0
          fi
          exit 1
