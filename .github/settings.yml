# Repository settings for geo-clash.
# Takes effect ONLY if the Probot Settings app is installed on
# the repo: https://probot.github.io/apps/settings/
# Otherwise configure manually in GitHub UI: Settings > General.
# Note: `main` is also guarded by a repo ruleset (DEFAULT_BRANCH)
# — this file documents the same intent declaratively.

repository:
  # Repository name
  name: geo-clash

  # Description
  description: >-
    Real-time multiplayer territory game played on real-world
    maps (React + Leaflet client, Express + Socket.io server)

  # Homepage URL (Vercel production deployment)
  homepage: https://geoclashers.vercel.app

  # Repository visibility (public or private)
  private: false

  # Enable/disable features
  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: true

  # Default branch
  default_branch: main

  # Squash-only merging (matches the repo's current settings)
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: false

  # Automatically delete head branches after PR merge
  delete_branch_on_merge: true

  # Enable automated security fixes
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

# Branch protection rules
branches:
  - name: main
    protection:
      # Require pull request reviews before merging
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true

      # Require status checks to pass before merging
      required_status_checks:
        strict: true
        # The test.yml job names run on every push/PR;
        # `staging-first` is the staging-first gate — see
        # workflows/require-staging.yml and AGENTS.md.
        contexts:
          - Server tests
          - Client tests
          - staging-first

      # Enforce restrictions for administrators
      enforce_admins: false

      # Require linear history
      required_linear_history: false

      # Allow force pushes
      allow_force_pushes: false

      # Allow deletions
      allow_deletions: false

  # Integration branch for the staging-first workflow —
  # see AGENTS.md "Git workflow — staging-first". PRs
  # squash-merge here on green; the post-release reset
  # force-pushes it back to `main`.
  - name: staging
    protection:
      required_pull_request_reviews: null
      required_status_checks:
        strict: false
        contexts:
          - Server tests
          - Client tests
      enforce_admins: false
      required_linear_history: false
      # Allow force pushes for the post-release `staging`
      # reset (in practice admins; the Promote-to-main
      # workflow resets via the refs API with the admin PAT).
      allow_force_pushes: true
      allow_deletions: false
